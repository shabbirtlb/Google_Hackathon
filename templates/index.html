<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {} },
      corePlugins: { preflight: true }
    }
  </script>

  <!-- React 18 + ReactDOM + Babel (for JSX in the browser) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* small helper */
    .dropdown-panel { max-height: 18rem; overflow: auto; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root" class="min-h-screen"></div>

  {% raw %}
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Utilities ---
    const debounce = (fn, ms = 250) => {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    };

    const TEAM_MIN_DEFAULT = 0;
    const TEAM_MAX_DEFAULT = 5000;

    // Helper to get initials from a company name
    const getInitials = (name) => {
      if (!name || typeof name !== 'string') {
        return '??';
      }

      return name
        .split(' ')
        .map(word => word.charAt(0).toUpperCase())
        .join('')
        .slice(0, 2);
    };


    // --- Company Card ---
    function CompanyCard({ company, onAnalyze }) {
      return (
        <div className="bg-white p-5 rounded-2xl shadow hover:shadow-lg transition flex flex-col">
          <div className="flex items-center gap-3">
            {company.small_logo_thumb_url ? (
              <img
                src={company.small_logo_thumb_url}
                alt={company.name}
                className="w-12 h-12 rounded-full object-cover"
              />
            ) : (
              <div className="w-12 h-12 rounded-full bg-gray-200 text-gray-700 flex items-center justify-center font-bold text-sm">
                {getInitials(company.name)}
              </div>
            )}
            <div className="min-w-0">
              <h3 className="font-semibold truncate">{company.name}</h3>
              <p className="text-xs text-gray-500 truncate">{company.batch || "—"}</p>
            </div>
          </div>

          <p className="text-sm text-gray-600 mt-3 line-clamp-3">
            {company.one_liner || company.long_description || ""}
          </p>

          <div className="mt-3 text-xs text-gray-500">
            <div><span className="font-medium">Team size:</span> {company.team_size ?? "N/A"}</div>
            <div className="truncate"><span className="font-medium">Industry:</span> {company.industry || "—"}</div>
            <div className="truncate"><span className="font-medium">Region:</span> {(company.regions || []).join(", ") || "—"}</div>
          </div>

          <div className="mt-4 flex gap-2">
            <a href={company.website || "#"} target="_blank" rel="noreferrer"
               className="px-3 py-2 text-sm rounded-xl border border-gray-200 hover:bg-gray-100">
              Website
            </a>
            <button
              onClick={() => onAnalyze(company.api)}
              className="ml-auto px-3 py-2 text-sm rounded-xl bg-blue-600 text-white hover:bg-blue-700"
              title="Fetch details via backend /company?api_url="
            >
              Start Analyzing
            </button>
          </div>
        </div>
      );
    }

    // --- Filters Bar ---
    function Filters({
      meta,
      query, setQuery,
      source, setSource,
      batch, setBatch,
      selectedTags, setSelectedTags,
      selectedRegions, setSelectedRegions,
      teamMin, setTeamMin,
      teamMax, setTeamMax,
      dataForRegions,
      onApply,
    }) {

      const companySources = useMemo(() => {
        if (!meta?.companies) return [];
        return Object.entries(meta.companies).map(([key, obj]) => ({ key, name: obj.name, api: obj.api, count: obj.count }));
      }, [meta]);

      const batches = useMemo(() => {
        if (!meta?.batches) return [];
        return Object.entries(meta.batches)
          .map(([key, obj]) => ({ key, name: obj.name, count: obj.count }))
          .sort((a,b) => a.name.localeCompare(b.name)).reverse();
      }, [meta]);

      const tags = useMemo(() => {
        if (!meta?.tags) return [];
        return Object.entries(meta.tags)
          .map(([key, obj]) => ({ key, name: obj.name, count: obj.count }))
          .sort((a,b) => a.name.localeCompare(b.name));
      }, [meta]);

      const regions = useMemo(() => {
        const set = new Set();
        (dataForRegions || []).forEach(c => (c.regions || []).forEach(r => set.add(r)));
        return Array.from(set).sort();
      }, [dataForRegions]);

      const [suggestions, setSuggestions] = useState([]);
      const debouncedSuggest = useRef(debounce((val, dataset) => {
        if (!val) return setSuggestions([]);
        const v = val.toLowerCase();
        const out = (dataset || []).filter(c => c.name?.toLowerCase().includes(v)).slice(0, 8);
        setSuggestions(out);
      }, 150)).current;

      useEffect(() => {
        debouncedSuggest(query, dataForRegions);
      }, [query, dataForRegions, debouncedSuggest]);

      const toggleInArray = (value, arr, setArr) => {
        if (arr.includes(value)) setArr(arr.filter(v => v !== value));
        else setArr([...arr, value]);
      };

      return (
        <div className="bg-white rounded-2xl shadow p-4 md:p-5 mb-6">
          <div className="flex flex-wrap items-center gap-3">
            {/* Search */}
            <div className="relative">
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search by company name..."
                className="w-64 md:w-80 border rounded-xl px-3 py-2 outline-none focus:ring-2 ring-blue-500"
              />
              {suggestions.length > 0 && (
                <div className="absolute z-10 mt-1 w-full bg-white border rounded-xl shadow dropdown-panel">
                  {suggestions.map(s => (
                    <button
                      key={s.id}
                      className="w-full text-left px-3 py-2 hover:bg-gray-50"
                      onClick={() => { setQuery(s.name); setSuggestions([]); }}
                    >
                      <div className="font-medium">{s.name}</div>
                      <div className="text-xs text-gray-500">{s.batch || "—"} • {s.industry || "—"}</div>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Source */}
            <select value={source} onChange={(e) => setSource(e.target.value)} className="border rounded-xl px-3 py-2" title="Dataset source">
              {companySources.map(s => <option key={s.key} value={s.api}>{s.name} ({s.count})</option>)}
            </select>

            {/* Batch */}
            <select value={batch} onChange={(e) => setBatch(e.target.value)} className="border rounded-xl px-3 py-2">
              <option value="">All Batches</option>
              {batches.map(b => <option key={b.key} value={b.name}>{b.name} ({b.count})</option>)}
            </select>

            {/* Tags */}
            <div className="relative">
              <details className="group">
                <summary className="list-none border rounded-xl px-3 py-2 cursor-pointer flex items-center gap-2">
                  Tags {selectedTags.length ? `(${selectedTags.length})` : ""}
                  <span className="ml-1 text-gray-400 group-open:rotate-180 transition">▾</span>
                </summary>
                <div className="absolute z-10 mt-2 w-72 bg-white border rounded-xl shadow p-2 dropdown-panel">
                  <div className="flex items-center mb-2">
                    <input
                      type="text"
                      placeholder="Filter tags..."
                      className="w-full border rounded-lg px-2 py-1 text-sm"
                      onInput={(e) => {
                        const term = e.currentTarget.value.toLowerCase();
                        const nodes = e.currentTarget.closest('.dropdown-panel').querySelectorAll('[data-tag-name]');
                        nodes.forEach(n => {
                          const show = n.dataset.tagName.includes(term);
                          n.style.display = show ? '' : 'none';
                        });
                      }}
                    />
                  </div>
                  <div className="grid grid-cols-1 gap-1">
                    {tags.map(t => (
                      <label key={t.key} data-tag-name={t.name.toLowerCase()} className="flex items-center gap-2 px-2 py-1 rounded hover:bg-gray-50">
                        <input type="checkbox" checked={selectedTags.includes(t.name)} onChange={() => toggleInArray(t.name, selectedTags, setSelectedTags)} />
                        <span className="text-sm">{t.name}</span>
                        <span className="ml-auto text-xs text-gray-400">{t.count}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </details>
            </div>

            {/* Regions */}
            <div className="relative">
              <details className="group">
                <summary className="list-none border rounded-xl px-3 py-2 cursor-pointer flex items-center gap-2">
                  Regions {selectedRegions.length ? `(${selectedRegions.length})` : ""}
                  <span className="ml-1 text-gray-400 group-open:rotate-180 transition">▾</span>
                </summary>
                <div className="absolute z-10 mt-2 w-72 bg-white border rounded-xl shadow p-2 dropdown-panel">
                  <div className="grid grid-cols-1 gap-1">
                    {regions.map(r => (
                      <label key={r} className="flex items-center gap-2 px-2 py-1 rounded hover:bg-gray-50">
                        <input type="checkbox" checked={selectedRegions.includes(r)} onChange={() => toggleInArray(r, selectedRegions, setSelectedRegions)} />
                        <span className="text-sm">{r}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </details>
            </div>

            {/* Team size slider */}
            <div className="flex items-center gap-3 flex-wrap">
              <div className="text-sm text-gray-600">Team size</div>
              <div className="flex items-center gap-2">
                <input type="range" min={TEAM_MIN_DEFAULT} max={TEAM_MAX_DEFAULT} value={teamMin}
                       onChange={(e) => { const val = Math.min(parseInt(e.target.value,10), teamMax); setTeamMin(val); }} className="w-36" />
                <input type="range" min={TEAM_MIN_DEFAULT} max={TEAM_MAX_DEFAULT} value={teamMax}
                       onChange={(e) => { const val = Math.max(parseInt(e.target.value,10), teamMin); setTeamMax(val); }} className="w-36" />
              </div>
              <div className="text-xs text-gray-500">{teamMin} – {teamMax === TEAM_MAX_DEFAULT ? `${TEAM_MAX_DEFAULT}+` : teamMax}</div>
            </div>
            
            <button onClick={onApply} className="ml-auto px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700">Apply Filters</button>
          </div>
        </div>
      );
    }

    // --- Analyze Panel ---
    function AnalyzePanel({ details, onClose, onSave }) {
      const [files, setFiles] = useState([]);
      const [loading, setLoading] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);
      const [showResultModal, setShowResultModal] = useState(false);

      useEffect(() => {
        if (details?.analysis_response) {
          setAnalysisResult(details.analysis_response);
          setShowResultModal(true);
        }
      }, [details]);

      if (!details) return null;

      const handleFileChange = (e) => setFiles(Array.from(e.target.files));

      const startAnalyzing = async () => {
        setLoading(true);
        try {
          const formData = new FormData();
          files.forEach((file) => formData.append("files", file));
          formData.append("company_url", details.url || details.website || "");

          const res = await fetch("/analyze", { method: "POST", body: formData });
          const data = await res.json();
          setAnalysisResult(data);
          setShowResultModal(true);
        } catch (err) {
          console.error(err);
          setAnalysisResult({ error: "Failed to analyze company." });
          setShowResultModal(true);
        } finally {
          setLoading(false);
        }
      };

      const closeInitialModal = () => {
        setAnalysisResult(null);
        onClose();
      };
      
      const closeResultModal = () => {
        setShowResultModal(false);
        onClose();
      };

      if (details.error) {
        return (
          <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl p-6 max-w-xl w-full">
              <h3 className="text-lg font-semibold mb-2">Analysis</h3>
              <p className="text-red-600">{details.error}</p>
              <div className="mt-4 text-right">
                <button onClick={closeInitialModal} className="px-4 py-2 rounded-xl border hover:bg-gray-50">Close</button>
              </div>
            </div>
          </div>
        );
      }
      
      return (
        <>
          <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl p-6 max-w-3xl w-full">
              <div className="flex items-center gap-3">
                <img src={details.small_logo_thumb_url || "https://via.placeholder.com/64"} className="w-12 h-12 rounded-full" />
                <div>
                  <h3 className="text-xl font-semibold">{details.name}</h3>
                  <div className="text-xs text-gray-500">{details.batch || "—"} • Team {details.team_size ?? "N/A"}</div>
                </div>
              </div>

              <div className="mt-4 grid md:grid-cols-2 gap-4 text-sm">
                <div>
                  <div><span className="font-medium">Industry:</span> {details.industry || "—"}</div>
                  <div><span className="font-medium">Stage:</span> {details.stage || "—"}</div>
                  <div><span className="font-medium">Status:</span> {details.status || "—"}</div>
                  <div><span className="font-medium">Regions:</span> {(details.regions || []).join(", ") || "—"}</div>
                  <div className="truncate"><span className="font-medium">Website:</span> <a className="text-blue-600 underline" target="_blank" href={details.website || "#"} rel="noreferrer">{details.website || "—"}</a></div>
                </div>
                <div>
                  <div className="font-medium">Tags</div>
                  <div className="flex flex-wrap gap-2 mt-1">{(details.tags || []).map(t => <span key={t} className="px-2 py-1 rounded-lg bg-gray-100 text-xs">{t}</span>)}</div>
                </div>
              </div>

              <div className="mt-4">
                <div className="font-medium mb-1">Description</div>
                <p className="text-gray-700 text-sm whitespace-pre-wrap">{details.long_description || "—"}</p>
              </div>

              <div className="mt-6">
                <label htmlFor="fileUpload" className="block text-sm font-medium text-gray-700 mb-1">Upload Company Documents</label>
                <input type="file" id="fileUpload" multiple onChange={handleFileChange} className="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none" />
              </div>

              <div className="mt-6 flex justify-end gap-2">
                <button onClick={closeInitialModal} className="px-4 py-2 rounded-xl border hover:bg-gray-50">Close</button>
                <button onClick={startAnalyzing} disabled={loading} className="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50">
                  {loading ? "Analyzing..." : "Start Analyzing"}
                </button>
              </div>
            </div>
          </div>
          {showResultModal && analysisResult && <AnalysisResultModal analysisResult={analysisResult} onClose={closeResultModal} onSave={onSave} />}
        </>
      );
    }

    // --- Analysis Result Modal ---
    function AnalysisResultModal({ analysisResult, onClose, onSave }) {
        if (!analysisResult) return null;

        // Check if the report exists and handle potential errors
        const financialReport = analysisResult.financial_report;
        const comparativeAnalysis = analysisResult.comparative_analysis;

        const handleSave = () => {
            onSave(analysisResult);
            // Replace alert with a better UI message
            const messageBox = document.createElement('div');
            messageBox.className = "fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-[100]";
            messageBox.innerHTML = `
              <div class="bg-white rounded-2xl shadow-xl p-6 max-w-xs w-full text-center">
                <h4 class="text-lg font-bold mb-2">Success!</h4>
                <p>Analysis saved successfully.</p>
                <button onclick="document.body.removeChild(this.closest('.fixed'));" class="mt-4 px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700">OK</button>
              </div>
            `;
            document.body.appendChild(messageBox);
            onClose();
        };

        const scoreColor = (score) => {
          if (score >= 80) return "text-green-600";
          if (score >= 60) return "text-yellow-600";
          return "text-red-600";
        };

        const formatCurrency = (amount) => {
            if (!amount) return "N/A";
            return `$${parseFloat(amount).toLocaleString()}`;
        };

        const getAssessmentColor = (assessment) => {
            switch(assessment) {
                case 'above_average': return 'text-green-600';
                case 'below_average': return 'text-red-600';
                case 'average': return 'text-yellow-600';
                default: return 'text-gray-600';
            }
        };

        return (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl shadow-xl p-6 max-w-5xl w-full max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-2xl font-bold">Investment Analysis Report</h3>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-lg">
                            &times;
                        </button>
                    </div>

                    {analysisResult.error ? (
                        <div className="text-red-600 text-center py-10">{analysisResult.error}</div>
                    ) : (
                        <div className="space-y-6">
                            {/* Executive Summary */}
                            <div className="bg-blue-50 p-6 rounded-xl border border-blue-200">
                                <h4 className="text-xl font-bold text-blue-800 mb-2">Executive Summary</h4>
                                <p className="text-gray-700">{financialReport?.company_overview?.description}</p>
                                <p className="mt-2 text-sm text-gray-600">
                                    <span className="font-semibold">Status:</span> {financialReport?.company_overview?.status}
                                    {financialReport?.company_overview?.acquisition && ` - Acquired by ${financialReport?.company_overview.acquisition.buyer} for ${financialReport?.company_overview.acquisition.price}`}
                                </p>
                            </div>

                            {/* Investment Recommendation & Key Metrics */}
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {/* Recommendation */}
                                <div className="bg-gray-100 p-6 rounded-xl text-center">
                                    <h4 className="text-lg font-semibold text-gray-800">Investment Rating</h4>
                                    <p className={`mt-2 text-5xl font-extrabold ${scoreColor(financialReport?.investment_recommendation?.score)}`}>
                                        {financialReport?.investment_recommendation?.rating}
                                    </p>
                                    <p className="text-sm text-gray-500 mt-1">Score: {financialReport?.investment_recommendation?.score}/100</p>
                                </div>
                                {/* Financial Highlights */}
                                <div className="bg-gray-100 p-6 rounded-xl">
                                    <h4 className="text-lg font-semibold text-gray-800">Financial Highlights</h4>
                                    <ul className="mt-2 space-y-2">
                                        <li>
                                            <span className="font-medium">Total Funding:</span> {formatCurrency(financialReport?.financial_analysis?.total_funding)}
                                        </li>
                                        <li>
                                            <span className="font-medium">Revenue Multiple:</span> {financialReport?.financial_analysis?.revenue_multiple.toFixed(2)}x
                                            <span className={`ml-2 text-sm font-semibold ${getAssessmentColor(financialReport?.sector_benchmarks?.company_vs_sector?.revenue_multiple?.assessment)}`}>
                                                ({financialReport?.sector_benchmarks?.sector_benchmarks?.construction_tech_multiple_range})
                                            </span>
                                        </li>
                                        <li>
                                            <span className="font-medium">Funding Efficiency:</span> {financialReport?.financial_analysis?.funding_efficiency.toFixed(2)}x
                                            <span className={`ml-2 text-sm font-semibold ${getAssessmentColor(financialReport?.sector_benchmarks?.company_vs_sector?.funding_efficiency?.assessment)}`}>
                                                ({financialReport?.sector_benchmarks?.sector_benchmarks?.typical_funding_efficiency})
                                            </span>
                                        </li>
                                    </ul>
                                </div>
                                {/* Growth Metrics */}
                                <div className="bg-gray-100 p-6 rounded-xl">
                                    <h4 className="text-lg font-semibold text-gray-800">Growth Metrics</h4>
                                    <ul className="mt-2 space-y-2">
                                        <li>
                                            <span className="font-medium">Customers:</span> {financialReport?.growth_indicators?.customer_acquisition_metrics?.total_customers.toLocaleString()}
                                        </li>
                                        <li>
                                            <span className="font-medium">Customer Growth Rate:</span> {financialReport?.growth_indicators?.customer_acquisition_metrics?.customer_growth_rate}%
                                        </li>
                                        <li>
                                            <span className="font-medium">Team Size:</span> {financialReport?.growth_indicators?.team_growth_indicators?.employee_count}
                                        </li>
                                        <li>
                                            <span className="font-medium">Acquisition Age:</span> {financialReport?.growth_indicators?.growth_trend_analysis?.acquisition_timeline?.company_age_at_acquisition} years
                                        </li>
                                    </ul>
                                </div>
                            </div>

                            {/* Strengths and Risks */}
                            <div className="grid md:grid-cols-2 gap-6">
                                {/* Strengths */}
                                <div className="bg-green-50 p-6 rounded-xl border border-green-200">
                                    <h4 className="text-lg font-semibold text-green-800">Key Strengths 💪</h4>
                                    <ul className="mt-2 list-disc list-inside space-y-1 text-gray-700">
                                        {financialReport?.investment_recommendation?.positive_factors?.map((f, i) => <li key={i}>{f}</li>)}
                                    </ul>
                                </div>
                                {/* Risks */}
                                <div className="bg-red-50 p-6 rounded-xl border border-red-200">
                                    <h4 className="text-lg font-semibold text-red-800">Potential Risks ⚠️</h4>
                                    <ul className="mt-2 list-disc list-inside space-y-1 text-gray-700">
                                        {financialReport?.investment_recommendation?.risk_factors?.map((f, i) => <li key={i}>{f}</li>)}
                                    </ul>
                                </div>
                            </div>

                            {/* Comparative Analysis */}
                            {comparativeAnalysis && (
                                <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                                    <h4 className="text-lg font-semibold text-gray-800">Comparative Analysis</h4>
                                    <p className="mt-2 text-sm text-gray-700 italic">
                                        {comparativeAnalysis.investor_takeaway}
                                    </p>
                                    <div className="grid md:grid-cols-2 gap-4 mt-4">
                                        <div>
                                            <h5 className="font-medium text-green-700">Pros</h5>
                                            <ul className="list-disc list-inside text-sm mt-1">
                                                {comparativeAnalysis.pros?.map((p, i) => <li key={i}>{p}</li>)}
                                            </ul>
                                        </div>
                                        <div>
                                            <h5 className="font-medium text-red-700">Red Flags</h5>
                                            <ul className="list-disc list-inside text-sm mt-1">
                                                {comparativeAnalysis.red_flags?.map((r, i) => <li key={i}>{r}</li>)}
                                            </ul>
                                        </div>
                                    </div>
                                    {comparativeAnalysis.inconsistencies?.length > 0 && (
                                        <div className="mt-4">
                                            <h5 className="font-medium text-amber-700">Data Inconsistencies</h5>
                                            <ul className="list-disc list-inside text-sm mt-1">
                                                {comparativeAnalysis.inconsistencies.map((inc, i) => <li key={i}>{inc}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    <div className="mt-6 flex justify-end gap-2">
                        {!analysisResult.error && (
                            <button onClick={handleSave} className="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700">
                                Save Analysis
                            </button>
                        )}
                        <button onClick={onClose} className="px-4 py-2 rounded-xl border hover:bg-gray-50">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // --- Saved Analysis Modal ---
    function SavedAnalysisModal({ savedAnalyses, onClose, onSelect }) {
      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl shadow-xl p-6 max-w-xl w-full max-h-[80vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-2xl font-semibold">Saved Analyses</h3>
              <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-lg">
                &times;
              </button>
            </div>
            {savedAnalyses.length === 0 ? (
              <p className="text-gray-500 text-center py-8">No saved analyses yet.</p>
            ) : (
              <ul className="space-y-4">
                {savedAnalyses.map((analysis, index) => (
                  <li key={index} className="flex justify-between items-center bg-gray-50 p-3 rounded-lg hover:bg-gray-100 transition">
                    <div>
                      <h4 className="font-medium">{analysis.financial_report?.company_overview.description}</h4>
                      <div className="text-xs text-gray-500 mt-1">
                        Status: {analysis.financial_report?.company_overview.status} • Funding: ${analysis.financial_report?.financial_analysis?.total_funding.toLocaleString()}
                      </div>
                    </div>
                    <button
                      onClick={() => onSelect(analysis)}
                      className="px-3 py-1 text-sm rounded-xl bg-blue-600 text-white hover:bg-blue-700"
                    >
                      View
                    </button>
                  </li>
                ))}
              </ul>
            )}
            <div className="mt-6 text-right">
              <button onClick={onClose} className="px-4 py-2 rounded-xl border hover:bg-gray-50">Close</button>
            </div>
          </div>
        </div>
      );
    }
    
    // --- Adjustable Weights Modal ---
    function WeightsModal({ onClose, onSaveWeights }) {
      const [weights, setWeights] = useState({
        financial: 25,
        growth: 40,
        market: 20,
        risk: 15,
      });
      const [total, setTotal] = useState(100);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState(null);

      // Fetch weights on load
      useEffect(() => {
        const fetchWeights = async () => {
          try {
            const response = await fetch('/weights');
            const data = await response.json();
            if (response.ok) {
              setWeights(data);
              setTotal(Object.values(data).reduce((sum, val) => sum + val, 0));
            } else {
              setError("Failed to fetch weights from server.");
            }
          } catch (e) {
            setError("Network error while fetching weights.");
          }
        };
        fetchWeights();
      }, []);

      const handleChange = (e) => {
        const { name, value } = e.target;
        const newWeights = { ...weights, [name]: parseInt(value, 10) || 0 };
        setWeights(newWeights);
        setTotal(Object.values(newWeights).reduce((sum, val) => sum + val, 0));
      };

      const handleSave = async () => {
        if (total !== 100) {
          setError("Total weights must equal 100.");
          return;
        }
        setSaving(true);
        setError(null);
        try {
          const response = await fetch('/weights', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(weights),
          });

          const data = await response.json();
          if (response.ok) {
            onSaveWeights(data.weights);
            onClose();
          } else {
            setError(data.error || "Failed to save weights.");
          }
        } catch (e) {
          setError("Network error while saving weights.");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-[60]">
          <div className="bg-white rounded-2xl shadow-xl p-6 max-w-lg w-full">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-2xl font-bold">Adjust Analysis Weights</h3>
              <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-lg">&times;</button>
            </div>

            <p className="text-gray-600 mb-4">
              Adjust the importance of each factor for the investment analysis. The total must be 100%.
            </p>

            <div className="space-y-4">
              {Object.entries(weights).map(([key, value]) => (
                <div key={key} className="flex items-center gap-4">
                  <label htmlFor={key} className="flex-1 capitalize font-medium text-gray-700">{key}:</label>
                  <input
                    type="range"
                    id={key}
                    name={key}
                    min="0"
                    max="100"
                    value={value}
                    onChange={handleChange}
                    className="w-full flex-grow-0"
                  />
                  <div className="w-12 text-right text-sm font-semibold">{value}%</div>
                </div>
              ))}
            </div>

            <div className="mt-6 flex justify-between items-center">
              <div className={`text-xl font-bold ${total === 100 ? 'text-green-600' : 'text-red-600'}`}>
                Total: {total}%
              </div>
              {error && <p className="text-red-600 text-sm ml-4">{error}</p>}
            </div>

            <div className="mt-6 flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl border hover:bg-gray-50">Cancel</button>
              <button
                onClick={handleSave}
                disabled={total !== 100 || saving}
                className="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50"
              >
                {saving ? "Saving..." : "Save Weights"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Main App ---
    function App() {
      const [meta, setMeta] = useState(null);
      const [dataset, setDataset] = useState([]);
      const [results, setResults] = useState([]);
      const [initial, setInitial] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [showSavedAnalyses, setShowSavedAnalyses] = useState(false);
      const [showWeightsModal, setShowWeightsModal] = useState(false);
      const [weights, setWeights] = useState({financial: 25, growth: 40, market: 20, risk: 15});

      const [savedAnalyses, setSavedAnalyses] = useState(() => {
        try {
          const stored = localStorage.getItem('savedAnalyses');
          return stored ? JSON.parse(stored) : [];
        } catch (e) {
          console.error("Could not load saved analyses from localStorage", e);
          return [];
        }
      });
      

      const [source, setSource] = useState("");
      const [batch, setBatch] = useState("");
      const [selectedTags, setSelectedTags] = useState([]);
      const [selectedRegions, setSelectedRegions] = useState([]);
      const [query, setQuery] = useState("");

      const [teamMin, setTeamMin] = useState(TEAM_MIN_DEFAULT);
      const [teamMax, setTeamMax] = useState(TEAM_MAX_DEFAULT);

      const [details, setDetails] = useState(null);

      useEffect(() => {
        (async () => {
          try {
            const resp = await fetch("https://yc-oss.github.io/api/meta.json");
            const m = await resp.json();
            setMeta(m);
            setSource(m?.companies?.all?.api || "https://yc-oss.github.io/api/companies/all.json");
          } catch (e) {
            setError("Failed to load YC meta.json");
          }
        })();
      }, []);

      useEffect(() => {
        if (!source) return;
        setLoading(true); setError(null);
        (async () => {
          try {
            const resp = await fetch(source);
            const data = await resp.json();
            setDataset(data);
            setResults(data.slice(0, 12));
            setInitial(data.slice(0, 12));
          } catch (e) {
            setError("Failed to load companies for selected source");
          } finally {
            setLoading(false);
          }
        })();
      }, [source]);

      const applyFilters = () => {
        const v = query.trim().toLowerCase();
        const out = (dataset || []).filter(c => {
          if (v && !(c.name || "").toLowerCase().includes(v)) return false;
          if (batch && c.batch !== batch) return false;
          if (selectedTags.length) {
            const tags = c.tags || [];
            if (!tags.some(t => selectedTags.includes(t))) return false;
          }
          if (selectedRegions.length) {
            const regs = c.regions || [];
            if (!regs.some(r => selectedRegions.includes(r))) return false;
          }
          const size = typeof c.team_size === "number" ? c.team_size : -1;
          if (!(teamMin <= size && size <= teamMax)) return false;
          return true;
        });
        setResults(out.slice(0, 100));
      };

      const onAnalyze = async (apiUrl) => {
        try {
          const resp = await fetch(`/company?api_url=${encodeURIComponent(apiUrl)}`);
          const data = await resp.json();
          setDetails(data);
        } catch (e) {
          setDetails({ error: "Could not fetch analysis." });
        }
      };

      const handleSaveAnalysis = (analysis) => {
        const updatedAnalyses = [...savedAnalyses, analysis];
        setSavedAnalyses(updatedAnalyses);
        localStorage.setItem('savedAnalyses', JSON.stringify(updatedAnalyses));
      };
      
      const handleSaveWeights = (newWeights) => {
        setWeights(newWeights);
        const messageBox = document.createElement('div');
        messageBox.className = "fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-[100]";
        messageBox.innerHTML = `
          <div class="bg-white rounded-2xl shadow-xl p-6 max-w-xs w-full text-center">
            <h4 class="text-lg font-bold mb-2">Success!</h4>
            <p>Weights saved successfully.</p>
            <button onclick="document.body.removeChild(this.closest('.fixed'));" class="mt-4 px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700">OK</button>
          </div>
        `;
        document.body.appendChild(messageBox);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Navbar */}
          <nav className="bg-white shadow-md py-4 px-6 flex items-center justify-between">
            <div className="flex items-center space-x-4">
              <a href="/" className="text-xl font-bold text-gray-800 hover:text-blue-600 transition">
                🚀 Venture Signal
              </a>
            </div>
            <div className="space-x-4">
              <button
                onClick={() => setShowWeightsModal(true)}
                className="px-4 py-2 rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-100 transition"
              >
                Adjust Weights
              </button>
              <button
                onClick={() => setShowSavedAnalyses(true)}
                className="px-4 py-2 rounded-full border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-100 transition"
              >
                Saved Analyses
              </button>
            </div>
          </nav>
          
          <div className="max-w-7xl mx-auto px-4 py-6 flex-grow">
            <header className="mb-6">
              <h1 className="text-3xl font-bold text-center">Venture Signal</h1>
              <p className="text-center text-gray-600 mt-2">Filter YC companies by batch, tags, regions, and team size. Start an analysis on any company.</p>
            </header>
          
            {meta && (
              <Filters meta={meta} query={query} setQuery={setQuery} source={source} setSource={setSource}
                       batch={batch} setBatch={setBatch} selectedTags={selectedTags} setSelectedTags={setSelectedTags}
                       selectedRegions={selectedRegions} setSelectedRegions={setSelectedRegions}
                       teamMin={teamMin} setTeamMin={setTeamMin} teamMax={teamMax} setTeamMax={teamMax}
                       dataForRegions={dataset} onApply={applyFilters} />
            )}

            <div className="bg-amber-50 border border-amber-200 text-amber-900 rounded-2xl p-4 mb-6">
              <div className="flex flex-wrap items-center gap-3">
                <span className="font-medium">Don’t see your company?</span>
                <span className="text-sm">You can still start an analysis by name.</span>
                <a href="#" onClick={(e) => { e.preventDefault(); /* Hook this to your 'Analyze by Name' flow */ }} className="ml-auto px-3 py-2 rounded-xl bg-amber-600 text-white hover:bg-amber-700 text-sm">Analyze by Name</a>
              </div>
            </div>

            {loading && <div className="text-center text-gray-500 py-10">Loading companies…</div>}
            {error && <div className="text-center text-red-600 py-10">{error}</div>}

            {!loading && !error && (
              <>
                <div className="flex items-center justify-between mb-3">
                  <div className="text-sm text-gray-500">Showing {results.length} / {(dataset || []).length}</div>
                  <button onClick={() => { setResults(dataset.slice(0, 12)); setQuery(""); setBatch(""); setSelectedTags([]); setSelectedRegions([]); setTeamMin(TEAM_MIN_DEFAULT); setTeamMax(TEAM_MAX_DEFAULT); }} className="text-sm px-3 py-2 rounded-xl border hover:bg-gray-50">Reset</button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {(results.length ? results : initial).slice(0, 12).map(c => <CompanyCard key={`${c.id}-${c.slug}`} company={c} onAnalyze={onAnalyze} />)}
                </div>
              </>
            )}

            <AnalyzePanel details={details} onClose={() => setDetails(null)} onSave={handleSaveAnalysis} />
            {showSavedAnalyses && (
              <SavedAnalysisModal
                savedAnalyses={savedAnalyses}
                onClose={() => setShowSavedAnalyses(false)}
                onSelect={(analysis) => {
                  setDetails({
                    ...analysis,
                    analysis_response: analysis,
                  });
                  setShowSavedAnalyses(false);
                }}
              />
            )}
            {showWeightsModal && (
              <WeightsModal
                onClose={() => setShowWeightsModal(false)}
                onSaveWeights={handleSaveWeights}
              />
            )}
          </div>
          
          <footer className="text-center text-xs text-gray-400 mt-10 py-4">Data source: YC OSS API • This demo filters client-side for hackathon speed.</footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  {% endraw %}
</body>
</html>
